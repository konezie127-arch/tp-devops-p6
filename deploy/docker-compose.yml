# Variables fournies par deploy.sh ou un fichier .env
services:
  api:
    image: ${IMAGE}:${TAG}
    restart: unless-stopped
    expose:
      - "8000"
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ../config/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
