[defaults]
inventory = inventory.ini
roles_path = roles
private_key_file = ~/.ssh/p6_key
# L'IP change a chaque reconstruction : on n'impose pas de known_hosts pour le TP
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
