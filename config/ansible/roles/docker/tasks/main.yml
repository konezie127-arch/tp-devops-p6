---
# Docker depuis les depots Ubuntu : peu de pieces mobiles, valable sur tout Ubuntu 24.04.
- name: Installer Docker et le plugin Compose v2
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose-v2
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Activer et demarrer Docker
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Autoriser l'utilisateur de deploiement a utiliser Docker
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: docker
    append: true
