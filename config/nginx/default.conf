server {
    listen 80;

    # DNS interne de Docker : Nginx re-resolve "api" a chaque requete (valid=5s).
    # Sans cela, Nginx garde l'ancienne IP du conteneur apres une mise a jour
    # et renvoie des 502.
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $upstream http://api:8000;

    location / {
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
